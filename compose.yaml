services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: voice_agent
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: local_dev_only_change_me
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d voice_agent"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
