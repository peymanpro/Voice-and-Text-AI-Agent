name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "feat/**"
      - "docs/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.16.0

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Temporary Prettier formatting diagnostic
        run: |
          pnpm exec prettier --write apps/web/app/globals.css apps/web/app/page.tsx apps/web/components/workspace-shell.tsx apps/web/test/workspace-state.test.mjs
          for file in apps/web/app/globals.css apps/web/app/page.tsx apps/web/components/workspace-shell.tsx apps/web/test/workspace-state.test.mjs; do
            echo "FILE-BEGIN:$file"
            cat "$file"
            echo "FILE-END:$file"
          done

      - name: Check formatting
        run: pnpm format:check

      - name: Type-check
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
