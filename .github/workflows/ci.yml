name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "feat/**"
      - "docs/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.16.0

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Temporary format database config test
        run: |
          pnpm exec prettier --write apps/api/test/database-config.test.mjs
          echo "FILE-BEGIN:apps/api/test/database-config.test.mjs"
          cat apps/api/test/database-config.test.mjs
          echo "FILE-END:apps/api/test/database-config.test.mjs"
      - name: Check formatting
        run: pnpm format:check

      - name: Type-check
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
